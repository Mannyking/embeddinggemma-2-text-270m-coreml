[project]
name = "embeddinggemma2-coreml"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "coremltools==9.0",
    "numpy==1.26.4",
    "pillow==12.3.0",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.20.1",
]

[project.optional-dependencies]
litert = [
    "litert-lm==0.18.1",
    "sentencepiece==0.2.2",
]
eval = [
    "pyarrow==21.0.0",
]
